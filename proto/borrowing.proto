syntax = "proto3";

package borrowing;

service BorrowingService {
    rpc RegisterMember (RegisterMemberRequest) returns (MemberResponse);
    rpc GetMember (MemberId) returns (MemberResponse);
    rpc ListMembers (Empty) returns (MemberList);

    rpc BorrowBook (BorrowBookRequest) returns (BorrowingResponse);
    rpc ReturnBook (ReturnBookRequest) returns (BorrowingResponse);
    rpc GetBorrowing (BorrowingId) returns (BorrowingResponse);
    rpc ListBorrowings (Empty) returns (BorrowingList);
    rpc ListMemberBorrowings (MemberId) returns (BorrowingList);


}

message Empty {}

message MemberId{
    int32 id =1;
}

message RegisterMemberRequest{
    string name=1;
    string email =2;
    string phone =3;
}

message MemberResponse{
    int32 id =1;
    string name=2;
    string email =3;
    string phone =4;
    string createdAt =5;
    string updatedAt =6;
}

message MemberList {
    repeated MemberResponse members =1;
}

message BorrowBookRequest {
    int32 memberId = 1;
    int32 bookId =2;
    string dueAt =3;
}

message ReturnBookRequest{
    int32 borrowingId =1;
}
message BorrowingId {
    int32 id =1;
}

message BorrowingResponse{
    int32 id =1;
    int32 memberId =2;
    int32 bookId =3;
    string borrowedAt =4;
    string dueAt =5;
    string returnedAt =6;
    string status =7;
    string createdAt =8;
    string updatedAt =9;
}

message BorrowingList {
    repeated BorrowingResponse borrowings =1;
}